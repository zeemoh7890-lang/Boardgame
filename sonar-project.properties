sonar.projectKey=Boardgame
sonar.projectName=Boardgame

# Source and test layout
sonar.sources=src/main
sonar.tests=src/test
sonar.sourceEncoding=UTF-8

# Java analysis (mvn package runs before the scan, so target/ exists)
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Coverage from the JaCoCo plugin already in your pom
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Skip JS/CSS analysis (avoids the Node.js bridge that ran out of memory)
sonar.exclusions=**/static/**,**/*.js,**/*.css
sonar.javascript.node.maxspace=768
